<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventosPro - Solicitud de Reserva</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="main.html">EventosPro</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="catalogo.html">Catálogo</a>
                <a class="nav-link active" href="solicitudReserva.html">Reservar</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h3 class="card-title mb-0">Solicitud de Reserva de Evento</h3>
            </div>
            <div class="card-body">
                <form>
                    <!-- Datos del Cliente -->
                    <h5 class="border-bottom pb-2 mb-3">1. Datos del Solicitante</h5>
                    <div class="row mb-3">
                        <div class="col-md-6 mb-2">
                            <label for="nombreCliente" class="form-label">Nombre Completo / Empresa</label>
                            <input type="text" class="form-control" id="nombreCliente" placeholder="Ej: Empresa ABC">
                        </div>
                        <div class="col-md-6 mb-2">
                            <label for="emailCliente" class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" id="emailCliente" placeholder="contacto@empresa.cl">
                        </div>
                    </div>

                    <!-- Datos del Evento -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">2. Detalle del Evento</h5>
                    <div class="row mb-3">
                        <div class="col-md-4 mb-2">
                            <label for="fechaEvento" class="form-label">Fecha del Evento</label>
                            <input type="date" class="form-control" id="fechaEvento">
                        </div>
                        <div class="col-md-4 mb-2">
                            <label for="horaInicio" class="form-label">Hora Inicio</label>
                            <input type="time" class="form-control" id="horaInicio">
                        </div>
                        <div class="col-md-4 mb-2">
                            <label for="asistentes" class="form-label">Cantidad de Asistentes</label>
                            <input type="number" class="form-control" id="asistentes" placeholder="Ej: 150">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="salonSelect" class="form-label">Selección de Salón</label>
                        <select class="form-select" id="salonSelect">
                            <option selected disabled>Seleccione un salón...</option>
                            <option value="SL001">SL001 - Salón Principal (Capacidad: 500)</option>
                            <option value="SL002">SL002 - Salón Ejecutivo (Capacidad: 50)</option>
                            <option value="SL003">SL003 - Salón de Seminarios (Capacidad: 120)</option>
                            <option value="SL004">SL004 - Salón de Bodas (Capacidad: 200)</option>
                            <option value="SL005">SL005 - Salón de Exposiciones (Capacidad: 300)</option>
                        </select>
                    </div>

                    <!-- Servicios Adicionales -->
                    <h5 class="border-bottom pb-2 mb-3 mt-4">3. Servicios Adicionales</h5>
                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="se001">
                            <label class="form-check-label" for="se001">SE001 - Catering ($15.000 p/p)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="se002">
                            <label class="form-check-label" for="se002">SE002 - Equipo Audiovisual Extra ($100.000)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="se003">
                            <label class="form-check-label" for="se003">SE003 - Personal de Apoyo ($50.000)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="se004">
                            <label class="form-check-label" for="se004">SE004 - Decoración ($200.000)</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2 d-md-flex justify-md-end mt-4">
                        <button type="reset" class="btn btn-secondary me-md-2">Limpiar Formulario</button>
                        <button type="submit" class="btn btn-primary">Enviar Solicitud</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
