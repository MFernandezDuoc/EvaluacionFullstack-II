<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventosPro - Registro de Usuario</title>
    <link rel="stylesheet" href="../CSS/mainStyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0 fw-bold">EventosPro</h4>
                        <small>Crear Nueva Cuenta de Cliente</small>
                    </div>
                    <div class="card-body p-4">
                        <form>
                            <div class="row mb-3">
                                <div class="col-md-6 mb-2 mb-md-0">
                                    <label for="regNombre" class="form-label fw-semibold">Nombre Completo</label>
                                    <input type="text" class="form-control" id="regNombre" placeholder="Ej: Juan Pérez" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="regEmpresa" class="form-label fw-semibold">Empresa / Organización</label>
                                    <input type="text" class="form-control" id="regEmpresa" placeholder="Opcional">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="regEmail" class="form-label fw-semibold">Correo Electrónico</label>
                                <input type="email" class="form-control" id="regEmail" placeholder="correo@ejemplo.com" required>
                            </div>

                            <div class="row mb-3">
                                <div class="col-md-6 mb-2 mb-md-0">
                                    <label for="regPass" class="form-label fw-semibold">Contraseña</label>
                                    <input type="password" class="form-control" id="regPass" placeholder="Mínimo 6 caracteres" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="regPassConfirm" class="form-label fw-semibold">Confirmar Contraseña</label>
                                    <input type="password" class="form-control" id="regPassConfirm" placeholder="Repite tu contraseña" required>
                                </div>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" id="termsCheck" required>
                                <label class="form-check-label text-muted" for="termsCheck">
                                    Acepto los términos y políticas de confidencialidad de EventosPro
                                </label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">Registrar Cuenta</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-white text-center py-3">
                        <small class="text-muted">¿Ya tienes cuenta? <a href="adminLogins.html" class="text-primary text-decoration-none">Inicia sesión</a></small>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="main.html" class="text-secondary text-decoration-none">← Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
