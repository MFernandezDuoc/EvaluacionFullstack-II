<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventosPro - Acceso Administrativo</title>
    <link rel="stylesheet" href="../CSS/mainStyle.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg border-0">
                    <div class="card-header bg-danger text-white text-center py-3">
                        <span class="badge bg-dark mb-1">Módulo Restringido</span>
                        <h4 class="mb-0 fw-bold">EventosPro Admin</h4>
                        <small class="text-white-50">Control Central de Eventos y Horarios</small>
                    </div>
                    <div class="card-body p-4">
                        <form action="gestionEventos.html">
                            <div class="mb-3">
                                <label for="adminUser" class="form-label fw-semibold">ID o Correo de Administrador</label>
                                <input type="email" class="form-control" id="adminUser" placeholder="admin@eventospro.cl" required>
                            </div>
                            <div class="mb-3">
                                <label for="adminPass" class="form-label fw-semibold">Contraseña Master</label>
                                <input type="password" class="form-control" id="adminPass" placeholder="••••••••" required>
                            </div>
                            <div class="mb-3">
                                <label for="adminKey" class="form-label fw-semibold">Código de Clave de Seguridad</label>
                                <input type="text" class="form-control" id="adminKey" placeholder="Ej: ADM-2026-X" required>
                            </div>
                            
                            <div class="alert alert-warning py-2 small mb-3" role="alert">
                                <strong>Atención:</strong> Este perfil otorga permisos para anular reservas, reprogramar horarios y eliminar eventos del sistema.
                            </div>

                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-danger btn-lg fw-bold">Ingresar al Panel de Control</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer bg-white text-center py-3">
                        <small class="text-muted">¿Eres cliente? <a href="main.html" class="text-primary text-decoration-none">Ir al portal público</a></small>
                    </div>
                </div>
                <div class="text-center mt-3">
                    <a href="main.html" class="text-secondary text-decoration-none">← Volver al Inicio</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
